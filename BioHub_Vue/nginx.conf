
server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
     # HTML 每次都向伺服器確認是否有新版
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # Vite 產生的版本化靜態資源
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }
}
